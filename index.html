<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order Ayam Gepuk Nurin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --yel:#fad242; --ink:#1d1a16; --bg:#fffaf0; --card:#ffffff; --tx:#2a211a; --mu:#7d6d5f; --bd:#efe0c2;
  --cream:#fff3d1; --grn:#2f9e44; --grn2:#278a3b; --red:#e5322d; --tagbg:#1d1a16; --tagtx:#fff3d1;
  --shadow:0 2px 10px rgba(60,35,0,.08);
  --d:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#17120e; --card:#241c15; --tx:#f7ead8; --mu:#b9a792; --bd:#3a2d21; --cream:#33271b; --tagbg:#000; --tagtx:#ffc21a; --shadow:none}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:500 16px/1.4 Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font-family:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.safe{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--yel);z-index:60}
.hide{display:none!important}
.mu{color:var(--mu);font-size:.88rem}

/* hero */
.hero{position:relative;background-color:var(--yel);background-repeat:repeat-x;background-size:168px auto;background-position:left top;color:var(--ink);padding:calc(env(safe-area-inset-top,0px) + 22px) 18px 26px;overflow:hidden;border-radius:0 0 28px 28px}
.hero-in{position:relative;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:14px}
.logo{width:112px;height:auto;flex:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.28))}
.hero h1{font:400 2rem/1 var(--d);margin:0}
.hero p{margin:6px 0 0;font-weight:700;font-size:.92rem}
.pills{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.pill{background:var(--ink);color:var(--yel);border-radius:99px;padding:3px 11px;font-size:.74rem;font-weight:800}

/* category nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:10px 0 9px;border-bottom:1px solid var(--bd)}
.nav-in{max-width:560px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:7px 16px;font:800 .9rem Nunito,sans-serif;cursor:pointer;min-height:40px}
.chip.on{background:var(--yel);color:var(--ink);border-color:var(--ink)}

.wrap{max-width:560px;margin:0 auto;padding:0 16px 150px}
.sec{scroll-margin-top:calc(66px + env(safe-area-inset-top,0px));padding-top:20px}
.sec h2{font:400 1.5rem/1 var(--d);margin:0 0 12px}

/* menu item */
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:10px;margin-bottom:10px;box-shadow:var(--shadow);transition:border-color .15s}
.item.sel{border-color:var(--grn)}
.item.cmp{padding:10px 12px;justify-content:space-between}
.thumb{width:96px;height:96px;border-radius:14px;object-fit:cover;flex:none;background:var(--cream)}
.info{flex:1;min-width:0}
.nm{font-weight:800;font-size:1.02rem;line-height:1.2}
.pr{color:var(--mu);font-weight:700;font-size:.92rem}
.bot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;flex-wrap:wrap}
.price{display:inline-block;background:var(--tagbg);color:var(--tagtx);font:400 1rem var(--d);padding:3px 10px;border-radius:6px;transform:rotate(-1.5deg)}
.bdg{display:inline-block;font:800 .66rem Nunito,sans-serif;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:2px 7px;margin-bottom:4px;color:#fff}
.b-best{background:var(--red)}.b-pop{background:#f76707}.b-new{background:var(--ink);color:var(--yel)}
.add{background:var(--grn);color:#fff;border:0;border-radius:99px;padding:9px 16px;font:800 .9rem Nunito,sans-serif;min-height:40px;cursor:pointer;white-space:nowrap}
.add:active{background:var(--grn2)}
.step{display:inline-flex;align-items:center;gap:4px;background:var(--cream);border-radius:99px;padding:3px}
.step button{width:38px;height:38px;border-radius:50%;border:0;background:var(--grn);color:#fff;font-size:22px;line-height:1;cursor:pointer}
.step .n{min-width:28px;text-align:center;font-weight:800}

/* cart bar */
.cart{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:25;transform:translateY(130%);transition:transform .25s ease;pointer-events:none}
.cart.show{transform:none;pointer-events:auto}
.cart button{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:560px;margin:0 auto;min-height:56px;background:var(--grn);color:#fff;border:0;border-radius:16px;padding:12px 18px;font:800 1rem Nunito,sans-serif;box-shadow:0 8px 24px rgba(30,100,50,.35);cursor:pointer}
.cart .l{display:flex;align-items:center;gap:10px}
.cnt{background:rgba(255,255,255,.24);border-radius:99px;padding:1px 10px;font-size:.9rem}
.ic{display:inline-flex}

/* overlay sheets */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;transform:translateY(100%);visibility:hidden;transition:transform .28s ease,visibility 0s .28s}
.sheet.open{transform:none;visibility:visible;transition:transform .28s ease}
.sheet.top2{z-index:50}
.sheet-in{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(130px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.top h2{font:400 1.6rem/1 var(--d);margin:0}
.back{width:44px;height:44px;border-radius:50%;border:2px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;display:grid;place-items:center}
.panel{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:12px 14px;margin-top:12px}
.panel h3{margin:0 0 6px;font:400 1.1rem var(--d)}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--bd)}
.line:last-child{border-bottom:0}
.line .t{flex:1;min-width:0}.line .t b{display:block;line-height:1.2}
.line .lt{min-width:72px;text-align:right;font-weight:800}
.line .step button{width:34px;height:34px;font-size:20px}
.lbl{display:block;font-weight:800;font-size:.85rem;margin:14px 0 6px}
.inp{width:100%;padding:13px 14px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:600 1rem Nunito,sans-serif}
textarea.inp{resize:vertical;min-height:64px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:12px;text-align:left;cursor:pointer;font:inherit;min-height:64px}
.mode b{display:block}.mode small{color:var(--mu);font-weight:600;line-height:1.25;display:block}
.mode.on{border-color:var(--grn);background:rgba(47,158,68,.12)}
.err{color:#e03131;font-weight:700;font-size:.9rem;min-height:1.3em;margin:10px 0 0}
.tot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-weight:800}
.tot .price{font-size:1.2rem}
.sbar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--bd);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:2}
.cta{display:block;width:100%;max-width:560px;margin:0 auto;min-height:54px;background:var(--grn);color:#fff;border:0;border-radius:16px;font:800 1.05rem Nunito,sans-serif;cursor:pointer;text-align:center;text-decoration:none;padding:15px 18px}
.cta:disabled{opacity:.6}
.cta:active{background:var(--grn2)}
.ghost{display:block;width:100%;margin-top:12px;min-height:48px;background:transparent;color:var(--tx);border:2px solid var(--bd);border-radius:14px;font:800 .95rem Nunito,sans-serif;cursor:pointer}

/* done */
.ok{width:64px;height:64px;border-radius:50%;background:var(--grn);color:#fff;display:grid;place-items:center;margin:8px auto 10px}
.center{text-align:center}
.center h2{font:400 1.7rem/1.1 var(--d);margin:0}
.step-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.num{width:30px;height:30px;border-radius:50%;background:var(--yel);color:var(--ink);display:grid;place-items:center;font:400 1rem var(--d);flex:none}
.step-h b{font-size:1.02rem}
.qr{display:block;width:100%;max-width:250px;border-radius:14px;margin:6px auto}

/* admin */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tile{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:10px 14px}
.tile span{display:block;color:var(--mu);font-size:.8rem;font-weight:700}
.tile b{font:400 1.5rem var(--d)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ocard{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.tag{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.74rem;font-weight:800}
.tag.baru{background:#ffe3e0;color:#b4231f}.tag.siap{background:#fff3bf;color:#7a5b00}.tag.selesai{background:#d3f9d8;color:#1b6b2a}
.ref{font:400 .95rem var(--d);background:var(--tagbg);color:var(--tagtx);border-radius:6px;padding:1px 8px;margin-right:6px}
.fchips{display:flex;gap:8px;overflow-x:auto;margin:10px 0 0;scrollbar-width:none}
.btn-sm{background:var(--grn);color:#fff;border:0;border-radius:10px;padding:8px 14px;font:800 .85rem Nunito,sans-serif;min-height:40px;cursor:pointer}
a.lnk{color:var(--grn);font-weight:800}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function change(id, d){
  var before = qty[id] || 0, after = Math.max(0, before + d);

  qty[id] = after;

}

    el("div", {class:"top"}, [backBtn, el("h2", {}, ["Semak Order"])]),
    el("div", {class:"panel"}, [el("h3", {}, ["Pesanan kau"]), linesBox, el("div", {class:"tot"}, [el("span", {}, ["Jumlah"]), totEl])]),
    el("div", {class:"panel"}, [
      el("h3", {}, ["Jenis order"]), el("div", {class:"modes"}, modeBtns),
      el("label", {class:"lbl", "for":"f-name"}, ["Nama"]), name,
      el("label", {class:"lbl", "for":"f-phone"}, ["No. telefon"]), phone,
      el("label", {class:"lbl", "for":"f-note"}, ["Nota (pilihan)"]), note, err
    ]),
    el("div", {class:"sbar"}, [submit])
  ]));
  root.appendChild(sheet);

  function openSheet(){ refreshSheet(); sheet.classList.add("open"); document.body.style.overflow = "hidden"; setTimeout(function(){ backBtn.focus(); }, 30); }
  function closeSheet(){ sheet.classList.remove("open"); document.body.style.overflow = ""; cartBtn.focus(); }
  escFn = function(e){ if (e.key === "Escape" && sheet.classList.contains("open") && !done.classList.contains("open")) closeSheet(); };
  document.addEventListener("keydown", escFn);

  function refreshSheet(){
    var ids = MENU.filter(function(m){ return qty[m.id] > 0; }).map(function(m){ return m.id; });
    var s = ids.join(",");
    if (s !== sig) {
      sig = s; rows = {}; linesBox.textContent = "";
      ids.forEach(function(id){
        var m = byId[id], ref = {}, lt = el("span", {class:"lt"}, [""]);
        var holder = el("div", {}, [stepper(id, m.n, ref)]);
        rows[id] = {lt:lt, ref:ref};
        linesBox.appendChild(el("div", {class:"line"}, [el("div", {class:"t"}, [el("b", {}, [m.n]), el("span", {class:"mu"}, [rm(m.p)])]), holder, lt]));
      });
    }
    ids.forEach(function(id){ rows[id].lt.textContent = rm(qty[id] * byId[id].p); if (rows[id].ref.el) rows[id].ref.el.textContent = String(qty[id]); });
    totEl.textContent = rm(total());
    submit.textContent = "Hantar Order · " + rm(total());
  }
  function refreshAll(){
    var n = count(), t = total();
    cntEl.textContent = n + " item"; cartTot.textContent = rm(t);
    cart.classList.toggle("show", n > 0); cart.setAttribute("aria-hidden", n > 0 ? "false" : "true"); cartBtn.tabIndex = n > 0 ? 0 : -1;
    if (sheet.classList.contains("open")) { if (!n) closeSheet(); else refreshSheet(); }
  }
  refreshHooks.push(refreshAll);

  // done overlay
  var done = el("div", {class:"sheet top2", role:"dialog", "aria-modal":"true", "aria-label":"Order diterima"});
  root.appendChild(done);

  async function doSubmit(){
    var items = MENU.filter(function(m){ return qty[m.id] > 0; }).map(function(m){ return {n:m.n, q:qty[m.id], p:m.p}; });
    if (!items.length) { err.textContent = "Pilih sekurang-kurangnya satu menu."; return; }
    var nm = name.value.trim(), ph = phone.value.trim();
    if (!nm) { err.textContent = "Isi nama kau."; name.focus(); return; }
    if (ph.replace(/\D/g, "").length < 9) { err.textContent = "No. telefon tak sah. Contoh: 0123456789"; phone.focus(); return; }
    err.textContent = ""; submit.disabled = true;
    var t = total(), ref = Date.now().toString(36).slice(-4).toUpperCase();
    var order = {ref:ref, name:nm, phone:ph, mode:mode, note:note.value.trim(), items:items, total:t, status:"baru", createdAt:Date.now()};
    saveCust({name:nm, phone:ph});
    try { var db = await claude.use("db"); if (db) await db.collection("orders").add(order); } catch (e) {}
    var lines = ["Order Ayam Gepuk Nurin #" + ref, "Nama: " + nm, "Tel: " + ph, "Jenis: " + mode];
    items.forEach(function(i){ lines.push(i.q + " x " + i.n); });
    if (order.note) lines.push("Nota: " + order.note);
    lines.push("Jumlah: " + rm(t), "Bayaran: DuitNow QR (resit di bawah)");
    var href = "https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent(lines.join("\n"));
    showDone(order, href); submit.disabled = false;
  }
  function showDone(order, href){
    done.textContent = "";
    var wa = el("a", {class:"cta", href:href, target:"_blank", rel:"noopener"}, ["Hantar Order & Resit di WhatsApp"]);
    var again = el("button", {class:"ghost", onclick:function(){
      qty = {}; MENU.forEach(function(m){ drawCtl(m); }); note.value = ""; sig = "";
      done.classList.remove("open"); sheet.classList.remove("open"); document.body.style.overflow = ""; refreshAll(); window.scrollTo(0, 0);
    }}, ["Buat order baru"]);
    done.appendChild(el("div", {class:"sheet-in", style:"padding-bottom:40px"}, [
      el("div", {class:"center"}, [el("div", {class:"ok"}, [icon(ICON_OK)]), el("h2", {}, ["Order #" + order.ref + " diterima"]),
        el("p", {class:"mu"}, ["Tinggal dua langkah lagi supaya order kau disahkan."])]),
      el("div", {class:"panel"}, [
        el("div", {class:"step-h"}, [el("span", {class:"num"}, ["1"]), el("b", {}, ["Bayar " + rm(order.total) + " guna DuitNow QR"])]),
        el("img", {class:"qr", src:QR_SRC, alt:"DuitNow QR IN'S LEGACY"}),
        el("p", {class:"mu center"}, ["IN’S LEGACY · Public Bank. Imbas guna app bank atau e-wallet, masukkan jumlah, kemudian screenshot resit."])
      ]),
      el("div", {class:"panel"}, [
        el("div", {class:"step-h"}, [el("span", {class:"num"}, ["2"]), el("b", {}, ["Hantar order + resit"])]),
        wa,
        el("p", {class:"mu center", style:"margin:10px 0 0"}, ["Lampirkan gambar resit dalam WhatsApp sebelum tekan hantar. Order disahkan lepas resit diterima."])
      ]),
      again
    ]));
    done.classList.add("open"); done.scrollTop = 0;
  }
}

// ---------- Dashboard admin (#admin) ----------
async function adminView(){
  app.appendChild(hero("Dashboard order"));
  var wrap = el("div", {class:"wrap", style:"padding-top:6px"});
  app.appendChild(wrap);
  var sel = el("select", {class:"inp", "aria-label":"Pilih bulan"});
  var fchips = el("div", {class:"fchips"});
  var filters = el("div", {class:"hide"}, [el("label", {class:"lbl", style:"margin-top:12px"}, ["Bulan"]), sel, fchips]);
  var tiles = el("div", {class:"tiles"});
  var box = el("div", {}, [el("p", {class:"mu"}, ["Memuatkan…"])]);
  wrap.appendChild(filters); wrap.appendChild(tiles); wrap.appendChild(box);
  wrap.appendChild(el("p", {}, [el("a", {class:"lnk", href:"#"}, ["← Halaman order"])]));
  var user = await claude.use("user"), db = await claude.use("db");
  var can = user ? await user.canEdit() : false;
  if (!can || !db) { box.textContent = ""; box.appendChild(el("p", {class:"mu"}, ["Halaman ini untuk pemilik sahaja. Log masuk akaun yang menerbitkan halaman ini."])); return; }
  var MONTHS = ["Januari","Februari","Mac","April","Mei","Jun","Julai","Ogos","September","Oktober","November","Disember"];
  var STAT = [["all", "Semua"], ["baru", "Baru"], ["siap", "Siap"], ["selesai", "Selesai"]];
  var docs = [], chosen = "all", st = "all";
  function key(ts){ var d = new Date(ts); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
  function label(k){ var a = k.split("-"); return MONTHS[+a[1] - 1] + " " + a[0]; }
  function render(){
    var keys = [];
    docs.forEach(function(d){ var k = key(d.data().createdAt); if (keys.indexOf(k) < 0) keys.push(k); });
    keys.sort().reverse();
    if (chosen !== "all" && keys.indexOf(chosen) < 0) chosen = "all";
    sel.textContent = "";
    sel.appendChild(el("option", {value:"all"}, ["Semua bulan"]));
    keys.forEach(function(k){ sel.appendChild(el("option", {value:k}, [label(k)])); });
    sel.value = chosen;
    fchips.textContent = "";
    STAT.forEach(function(s){ fchips.appendChild(el("button", {class:"chip" + (st === s[0] ? " on" : ""), onclick:function(){ st = s[0]; render(); }}, [s[1]])); });
    filters.className = "";
    var list = docs.filter(function(d){ var o = d.data(); return (chosen === "all" || key(o.createdAt) === chosen) && (st === "all" || (o.status || "baru") === st); });
    var tot = 0; list.forEach(function(d){ tot += Number(d.data().total) || 0; });
    tiles.textContent = "";
    tiles.appendChild(el("div", {class:"tile"}, [el("span", {}, ["Order"]), el("b", {}, [String(list.length)])]));
    tiles.appendChild(el("div", {class:"tile"}, [el("span", {}, ["Jumlah"]), el("b", {}, [rm(tot)])]));
    box.textContent = "";
    if (!list.length) { box.appendChild(el("p", {class:"mu"}, ["Tiada order."])); return; }
    list.forEach(function(d){
      var o = d.data(), s = o.status || "baru";
      var next = s === "baru" ? "siap" : s === "siap" ? "selesai" : null;
      var head = [];
      if (o.ref) head.push(el("span", {class:"ref"}, ["#" + String(o.ref)]));
      head.push(el("b", {}, [String(o.name || "")]));
      var kids = [
        el("div", {class:"row"}, [el("span", {}, head), el("span", {class:"tag " + s}, [s.toUpperCase()])]),
        el("div", {class:"mu"}, [String(o.phone || "") + " · " + String(o.mode || "") + " · " + new Date(o.createdAt).toLocaleString("ms-MY")])
      ];
      if (o.address) kids.push(el("div", {class:"mu"}, ["Alamat: " + String(o.address)]));
      (o.items || []).forEach(function(i){ kids.push(el("div", {}, [i.q + " x " + i.n])); });
      if (o.note) kids.push(el("div", {class:"mu"}, ["Nota: " + String(o.note)]));
      var foot = [el("b", {}, [rm(Number(o.total) || 0)])];
      if (next) foot.push(el("button", {class:"btn-sm", onclick:function(){ db.doc("orders/" + d.id).update({status:next}); }}, ["Tandakan " + next]));
      kids.push(el("div", {class:"row", style:"margin-top:8px;align-items:center"}, foot));
      box.appendChild(el("div", {class:"ocard"}, kids));
    });
  }
  sel.onchange = function(){ chosen = sel.value; render(); };
  var t = setTimeout(function(){ box.textContent = "Data belum dapat dicapai. Cuba semak sambungan internet."; }, 10000);
  db.collection("orders").orderBy("createdAt", "desc").limit(1000).onSnapshot(function(snap){
    clearTimeout(t); docs = snap.docs; render();
  }, function(){ clearTimeout(t); box.textContent = "Tak dapat baca data order."; });
}
route();
</script>
